name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Ensure Persistent Signing Keystore
      run: |
        if [ ! -f "app/release.keystore" ]; then
          keytool -genkey -v \
            -keystore app/release.keystore \
            -storepass android \
            -alias flashalarm \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FlashAlarm, OU=App, O=FlashAlarm, L=Beijing, ST=Beijing, C=CN"
        fi

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FlashAlarm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
