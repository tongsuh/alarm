name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Ensure Persistent Signing Keystore
      run: |
        if [ ! -f "app/release.keystore" ]; then
          keytool -genkey -v \
            -keystore app/release.keystore \
            -storepass android \
            -alias flashalarm \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FlashAlarm, OU=App, O=FlashAlarm, L=Beijing, ST=Beijing, C=CN"
        fi

    - name: Build Release and Debug APKs
      run: |
        gradle assembleRelease assembleDebug --stacktrace
        mkdir -p release_apks
        cp app/build/outputs/apk/release/app-release.apk release_apks/FlashAlarm-v1.8.0.apk
        cp app/build/outputs/apk/debug/app-debug.apk release_apks/FlashAlarm-v1.8.0-debug.apk

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlashAlarm-apks
        path: release_apks/*.apk
        retention-days: 7

    - name: Publish GitHub Release (Direct APK Download)
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete v1.8.0 --yes --cleanup-tag 2>/dev/null || true
        gh release create v1.8.0 release_apks/FlashAlarm-v1.8.0.apk release_apks/FlashAlarm-v1.8.0-debug.apk \
          --title "FlashAlarm v1.8.0 (无需解压·手机直装)" \
          --notes-file RELEASE_NOTES.md \
          --latest

