name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Ensure Persistent Signing Keystore
      run: |
        if [ ! -f "app/release.keystore" ]; then
          keytool -genkey -v \
            -keystore app/release.keystore \
            -storepass android \
            -alias flashalarm \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FlashAlarm, OU=App, O=FlashAlarm, L=Beijing, ST=Beijing, C=CN"
        fi

    - name: Build Release and Debug APKs
      run: |
        gradle assembleRelease assembleDebug --stacktrace
        mkdir -p release_apks
        cp app/build/outputs/apk/release/app-release.apk release_apks/FlashAlarm-v1.8.0.apk
        cp app/build/outputs/apk/debug/app-debug.apk release_apks/FlashAlarm-v1.8.0-debug.apk

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlashAlarm-apks
        path: release_apks/*.apk
        retention-days: 7

    - name: Publish GitHub Release (Direct APK Download)
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete v1.8.0 --yes --cleanup-tag 2>/dev/null || true
        gh release create v1.8.0 release_apks/FlashAlarm-v1.8.0.apk release_apks/FlashAlarm-v1.8.0-debug.apk \
          --title "FlashAlarm v1.8.0 (无需解压·手机直装)" \
          --notes "### 📱 FlashAlarm v1.8.0 手机直接安装版

- **直接下载安装**：请直接点击下方 Assets 列表中的 \`FlashAlarm-v1.8.0.apk\`（推荐正式版）即可直接在手机上下载并安装，**无需解压**！
- **固定持久签名**：已绑定专属持久化签名（支持 v1 + v2 签名方案），兼容各大国产安卓系统，安装完成后未来所有更新均支持直接平滑覆盖升级。
- **本次更新**：
  1. 独立【睡眠】分析Tab，呈现整夜 1 分钟切片与 Hypnogram 催眠时序阶梯图谱，标注重度触梦星标 ✨；
  2. 极暗纯黑床头屏保，屏幕任意轻触仅退出界面返回系统（后台睡眠感知毫秒级不中断）；
  3. 底部向右滑动结束睡眠滑块（Slide to Stop），防误触阻尼与触觉震动反馈；
  4. 补全 v1 (JAR) 签名与 Release 发布变体，彻底解决解析安装包错误与测试版拦截问题。" \
          --latest
